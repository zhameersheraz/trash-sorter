<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trash Sorter &mdash; waste sorting station</title>
<meta name="description" content="Point a camera at litter and find out which bin it belongs in." />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2317181A' stroke-width='1.9'%3E%3Crect x='4.5' y='4.5' width='15' height='15'/%3E%3Crect x='6' y='12' width='12' height='6' fill='%231D4ED8' stroke='none'/%3E%3Crect x='6' y='15' width='12' height='3' fill='%2317181A' stroke='none'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="masthead">
  <div class="wordmark">
    <!-- The mark is the app's own idea: a bin carrying the colour banding it
         fills with. A stock bin-and-lid icon says "trash"; this one says
         "this sorter", and it is not a symbol used by anyone else. -->
    <svg class="wordmark-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <rect x="4.5" y="4.5" width="15" height="15" />
      <rect x="6" y="12" width="12" height="6" fill="#1D4ED8" stroke="none" />
      <rect x="6" y="15" width="12" height="3" fill="currentColor" stroke="none" />
    </svg>
    <h1>Trash Sorter</h1>
    <p class="wordmark-sub">waste sorting station</p>
  </div>
  <p class="status" id="status" data-state="loading">
    <span class="status-led" aria-hidden="true"></span>
    <span id="statusText">loading model</span>
  </p>
</header>

<main class="frame">

  <section class="bay bay--view" aria-label="Camera view">
    <div class="viewport" id="viewport">
      <video id="cam" playsinline autoplay muted></video>
      <img id="still" alt="" />
      <div class="viewport-idle" id="viewportIdle">
        <p>No item in frame</p>
        <p class="dim">Start the camera, or load a photo</p>
      </div>
    </div>

    <div class="controls">
      <button id="toggleCam" class="btn btn--solid" disabled>Start camera</button>
      <!-- Input precedes the label so #fileInput:focus-visible + .btn can draw the
           focus ring on the visible control. A clipped input on its own is
           focusable but invisible, which strands keyboard users. -->
      <input id="fileInput" class="sr-only" type="file" accept="image/*" />
      <label class="btn btn--line" for="fileInput">Load a photo</label>
    </div>
  </section>

  <section class="bay bay--verdict" id="verdict" data-empty="true">

    <div class="verdict-head">
      <p class="field-label">Detected</p>
      <p class="verdict-confidence" id="confTop">&mdash;</p>
    </div>

    <h2 class="verdict-item" id="resultName">Nothing yet</h2>

    <div class="binstrip">
      <div class="binstrip-track"><div class="binstrip-fill" id="binFill"></div></div>
      <div class="binstrip-meta">
        <span class="binstrip-bin" id="binName">Bin unknown</span>
        <span class="binstrip-note" id="binNote">Point the camera at an item</span>
      </div>
    </div>

    <ul class="readout" id="bars"></ul>

  </section>

</main>

<footer class="keyline">
  <p class="keyline-title">Bins</p>
  <ul class="keyline-list" id="binLegend"></ul>
</footer>

<!-- The verdict panel updates ~8x a second, so it cannot itself be the live
     region or assistive tech will narrate every frame. Announce only when the
     winning class actually changes. -->
<p class="sr-only" id="announcer" role="status" aria-live="polite"></p>

<noscript>
  <p style="max-width:40rem;margin:2rem auto;padding:0 1.5rem;font-family:monospace;line-height:1.6">
    Trash Sorter needs JavaScript to run the image model in your browser.
    Enable JavaScript and reload this page.
  </p>
</noscript>

<script src="vendor/tf.min.js"></script>
<script src="vendor/teachablemachine-image.min.js"></script>
<script src="app.js"></script>
</body>
</html>
