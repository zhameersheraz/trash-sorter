<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trash Sorter &mdash; AI Waste Classifier</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/>
      </svg>
    </span>
    <div>
      <h1>Trash Sorter</h1>
      <p>Point your camera at waste &mdash; get the right bin</p>
    </div>
  </div>
  <div class="status" id="status" data-state="loading">
    <span class="dot" aria-hidden="true"></span>
    <span id="statusText">Loading model&hellip;</span>
  </div>
</header>

<main class="layout">

  <section class="stage card">
    <div class="video-wrap">
      <video id="cam" playsinline autoplay muted></video>
      <img id="still" alt="Photo being classified" />
      <div class="scanner" aria-hidden="true"></div>
      <div class="stage-empty" id="stageEmpty">
        <p>Camera is off</p>
        <small>Start it, or drop in a photo below</small>
      </div>
    </div>

    <div class="stage-actions">
      <button id="toggleCam" class="btn btn-primary" disabled>Start camera</button>
      <label class="btn btn-ghost" for="fileInput">Use a photo</label>
      <input id="fileInput" class="sr-only" type="file" accept="image/*" />
    </div>
  </section>

  <section class="result card" id="resultCard" data-empty="true">
    <p class="result-eyebrow">Detected</p>
    <h2 class="result-name" id="resultName">Waiting for input</h2>
    <p class="result-sub" id="resultSub">Start the camera or choose a photo</p>

    <div class="bin">
      <div class="bin-icon" id="binIcon" aria-hidden="true">?</div>
      <div class="bin-text">
        <span class="bin-label">Put it in</span>
        <strong class="bin-name" id="binName">&mdash;</strong>
        <span class="bin-note" id="binNote"></span>
      </div>
    </div>

    <div class="confidence">
      <div class="conf-head">
        <span>Confidence</span>
        <strong id="confTop">0%</strong>
      </div>
      <ul class="bars" id="bars"></ul>
    </div>
  </section>

</main>

<footer class="bins">
  <h3>The bins</h3>
  <ul id="binLegend"></ul>
</footer>

<script src="vendor/tf.min.js"></script>
<script src="vendor/teachablemachine-image.min.js"></script>
<script src="app.js"></script>
</body>
</html>
